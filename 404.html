<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>الصفحة غير موجودة | 404</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&family=Noto+Kufi+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-color: #5246B5;
      --glass-bg: rgba(255, 255, 255, 0.06);
      --glass-border: rgba(255, 255, 255, 0.12);
      --glass-border-hover: rgba(255, 255, 255, 0.25);
      --text-primary: #FFFFFF;
      --text-secondary: rgba(255, 255, 255, 0.75);
      --btn-bg: #FFFFFF;
      --btn-text: #17152B;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Noto+Kufi+Arabic', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--text-primary);
      padding: 24px;
      overflow: hidden;
      position: relative;
    }

    /* Ambient glow effects behind glass card */
    .ambient-glow {
      position: absolute;
      width: 320px;
      height: 320px;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.15) 0%, transparent 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      filter: blur(50px);
    }

    /* 404 Container */
    .error-card {
      position: relative;
      max-width: 500px;
      width: 100%;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 28px;
      padding: 48px 36px;
      text-align: center;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
    }

    .error-code {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 84px;
      font-weight: 800;
      line-height: 1;
      letter-spacing: -0.04em;
      color: #FFFFFF;
      margin-bottom: 16px;
      background: linear-gradient(180deg, #FFFFFF 40%, rgba(255, 255, 255, 0.4) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .error-title {
      font-size: 22px;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 12px;
    }

    .error-desc {
      font-size: 14.5px;
      line-height: 1.7;
      color: var(--text-secondary);
      margin-bottom: 32px;
    }

    /* Home Button */
    .btn-home {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: var(--btn-bg);
      color: var(--btn-text);
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
      padding: 14px 28px;
      border-radius: 999px;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.15);
    }

    .btn-home:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.22);
      opacity: 0.96;
    }

    .btn-home:active {
      transform: translateY(0);
    }

    .btn-home svg {
      width: 16px;
      height: 16px;
      transition: transform 0.2s ease;
    }

    .btn-home:hover svg {
      transform: translateX(3px); /* RTL forward motion */
    }

    @media (max-width: 480px) {
      .error-card {
        padding: 36px 24px;
      }
      
      .error-code {
        font-size: 72px;
      }

      .error-title {
        font-size: 20px;
      }
    }
  </style>
</head>
<body>

  <div class="ambient-glow"></div>

  <main class="error-card">
    <div class="error-code">404</div>
    <h1 class="error-title">الصفحة غير موجودة</h1>
    <p class="error-desc">
      يبدو أن الرابط الذي تبحث عنه غير متوفر، أو تم نقله إلى مسار آخر.
    </p>
    <a href="/" class="btn-home">
      <span>الرجوع للرئيسية</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="m15 18-6-6 6-6"/>
      </svg>
    </a>
  </main>

</body>
</html>
